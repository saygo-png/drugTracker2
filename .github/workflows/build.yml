name: build

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Build program
        run: nix build --accept-flake-config --print-build-logs
